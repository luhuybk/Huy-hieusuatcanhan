<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014" id="tc">
<meta name="description" content="Sổ tay cá nhân: quan hệ, công việc, giao việc và sổ tiền.">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Hub">
<title>Life Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<!-- Đặt chủ đề trước khi vẽ, tránh loé sáng/tối một nhịp khi mở app -->
<script>try{var t=localStorage.getItem('lifehub.theme');if(t){document.documentElement.dataset.theme=t;
document.getElementById('tc').content=t==='light'?'#f4f6fa':'#0e1014';}}catch(e){}
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim" data-act="scrim"></div>

  <div class="main">
    <div class="bar">
      <button class="iconbtn burger" data-act="burger">☰</button>
      <div class="grow"><h1 id="ttl">Tổng quan</h1><span class="sub" id="sub"></span></div>
      <button class="iconbtn" data-act="capture" title="Ghi nhanh">✎</button>
      <button class="iconbtn" data-act="search" title="Tìm kiếm (Ctrl+K)">🔍</button>
      <button class="iconbtn" data-act="nav" data-id="settings">⚙︎</button>
    </div>
    <main class="wrap" id="view"></main>
  </div>
</div>

<button class="fab" id="fab" data-act="fab" title="Thêm mới (việc cần làm: Ctrl+J)">+</button>
<div id="modals"></div>

<script src="js/state.js"></script>
<script src="js/lunar.js"></script>
<script src="js/voice.js"></script>
<script src="js/api.js"></script>
<script src="js/sync.js"></script>
<script src="js/notify.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
